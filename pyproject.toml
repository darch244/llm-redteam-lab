[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-redteam-lab"
version = "0.1.0"
description = "Adversarial testing framework for LLM applications — MITRE ATLAS-mapped probes, scenarios, and reports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["llm", "security", "red-team", "prompt-injection", "mitre-atlas", "garak", "pyrit"]
authors = [{ name = "llm-redteam-lab contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "anyio>=4.0",
    "httpx>=0.27",
    "Jinja2>=3.1",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
pdf = ["reportlab>=4.0"]

[project.scripts]
rtl = "rtl.cli:app"

[tool.setuptools.packages.find]
include = ["rtl*"]

[tool.setuptools.package-data]
rtl = ["reporting/templates/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["rtl"]
omit = ["rtl/_version.py"]

[tool.coverage.report]
fail_under = 55
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Probe libraries are prose data; do not wrap natural-language prompts.
"rtl/attacks/prompts/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true