name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check rtl tests
          ruff format --check rtl tests
      - name: Type-check (mypy)
        run: mypy rtl
      - name: Tests + coverage
        run: pytest -q --cov=rtl --cov-report=term-missing
      - name: Detection benchmark verification
        run: rtl benchmark --version 3
      - name: Offline demo smoke (adaptive planning)
        run: rtl scan --target mock --suite suites/quick.yaml --planner heuristic --output reports
      - name: Deterministic replay verification
        run: rtl replay --manifest reports/report.json --output reports/replay
      - name: Upload SARIF results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: reports/report.sarif
      - name: Upload Scan Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports-${{ matrix.python-version }}
          path: reports/